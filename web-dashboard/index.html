<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sensor Dashboard — Live Phone Sensor Data</title>
  <meta name="description" content="Real-time web dashboard for viewing accelerometer and gyroscope sensor data streamed from your phone." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header" id="app-header">
      <div class="header-left">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
        <div>
          <h1 class="header-title">Sensor Dashboard</h1>
          <p class="header-subtitle">Live phone sensor data</p>
        </div>
      </div>
      <div class="header-right">
        <div class="connection-status" id="connection-status">
          <span class="status-dot" id="status-dot"></span>
          <span class="status-text" id="status-text">Disconnected</span>
        </div>
      </div>
    </header>

    <!-- Connection Panel -->
    <section class="connect-panel glass-card" id="connect-panel">
      <div class="connect-inner">
        <div class="connect-icon-wrap">
          <svg class="connect-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
            <line x1="12" y1="18" x2="12.01" y2="18"/>
          </svg>
        </div>
        <div class="connect-fields">
          <label class="field-label" for="phone-url">Phone HTTP URL</label>
          <div class="url-input-group">
            <input
              type="text"
              id="phone-url"
              class="url-input"
              placeholder="http://192.168.1.100:8080"
              spellcheck="false"
              autocomplete="off"
            />
            <button class="btn btn-primary" id="connect-btn">
              <span class="btn-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
              </span>
              <span class="btn-label" id="connect-btn-label">Connect</span>
            </button>
          </div>
          <p class="connect-hint">Start the HTTP server on your phone, then enter its URL here.</p>
        </div>
      </div>
    </section>

    <!-- Stats Bar -->
    <section class="stats-bar" id="stats-bar">
      <div class="stat-chip" id="stat-samples">
        <span class="stat-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </span>
        <span class="stat-label">Samples</span>
        <span class="stat-value" id="stat-samples-value">0</span>
      </div>
      <div class="stat-chip" id="stat-rate">
        <span class="stat-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </span>
        <span class="stat-label">Rate</span>
        <span class="stat-value" id="stat-rate-value">0 Hz</span>
      </div>
      <div class="stat-chip" id="stat-latency">
        <span class="stat-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </span>
        <span class="stat-label">Elapsed</span>
        <span class="stat-value" id="stat-latency-value">00:00</span>
      </div>
      <div class="stat-chip" id="stat-packet">
        <span class="stat-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
        </span>
        <span class="stat-label">Seq</span>
        <span class="stat-value" id="stat-packet-value">—</span>
      </div>
    </section>

    <!-- Main Dashboard -->
    <main class="dashboard" id="dashboard">
      <!-- Accelerometer Card -->
      <section class="sensor-card glass-card" id="accel-card">
        <div class="sensor-header">
          <div class="sensor-title-group">
            <div class="sensor-icon accel-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
              </svg>
            </div>
            <div>
              <h2 class="sensor-name">Accelerometer</h2>
              <span class="sensor-unit">m/s²</span>
            </div>
          </div>
          <div class="sensor-magnitude" id="accel-magnitude">0.000</div>
        </div>

        <div class="axis-rows">
          <div class="axis-row">
            <span class="axis-label accel-label">X</span>
            <div class="axis-bar-track">
              <div class="axis-bar accel-bar" id="accel-x-bar"></div>
            </div>
            <span class="axis-value mono" id="accel-x-value">0.000</span>
          </div>
          <div class="axis-row">
            <span class="axis-label accel-label">Y</span>
            <div class="axis-bar-track">
              <div class="axis-bar accel-bar" id="accel-y-bar"></div>
            </div>
            <span class="axis-value mono" id="accel-y-value">0.000</span>
          </div>
          <div class="axis-row">
            <span class="axis-label accel-label">Z</span>
            <div class="axis-bar-track">
              <div class="axis-bar accel-bar" id="accel-z-bar"></div>
            </div>
            <span class="axis-value mono" id="accel-z-value">0.000</span>
          </div>
        </div>

        <div class="chart-container">
          <canvas id="accel-chart" class="sensor-chart"></canvas>
        </div>
      </section>

      <!-- Gyroscope Card -->
      <section class="sensor-card glass-card" id="gyro-card">
        <div class="sensor-header">
          <div class="sensor-title-group">
            <div class="sensor-icon gyro-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 11-6.219-8.56"/>
                <polyline points="21 3 21 9 15 9"/>
              </svg>
            </div>
            <div>
              <h2 class="sensor-name">Gyroscope</h2>
              <span class="sensor-unit">rad/s</span>
            </div>
          </div>
          <div class="sensor-magnitude gyro-mag" id="gyro-magnitude">0.000</div>
        </div>

        <div class="axis-rows">
          <div class="axis-row">
            <span class="axis-label gyro-label">X</span>
            <div class="axis-bar-track">
              <div class="axis-bar gyro-bar" id="gyro-x-bar"></div>
            </div>
            <span class="axis-value mono" id="gyro-x-value">0.000</span>
          </div>
          <div class="axis-row">
            <span class="axis-label gyro-label">Y</span>
            <div class="axis-bar-track">
              <div class="axis-bar gyro-bar" id="gyro-y-bar"></div>
            </div>
            <span class="axis-value mono" id="gyro-y-value">0.000</span>
          </div>
          <div class="axis-row">
            <span class="axis-label gyro-label">Z</span>
            <div class="axis-bar-track">
              <div class="axis-bar gyro-bar" id="gyro-z-bar"></div>
            </div>
            <span class="axis-value mono" id="gyro-z-value">0.000</span>
          </div>
        </div>

        <div class="chart-container">
          <canvas id="gyro-chart" class="sensor-chart"></canvas>
        </div>
      </section>
    </main>

    <!-- 3D Orientation Visualization -->
    <section class="orientation-section glass-card" id="orientation-section">
      <div class="sensor-header">
        <div class="sensor-title-group">
          <div class="sensor-icon orient-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="4" width="16" height="16" rx="2" ry="2"/>
              <rect x="9" y="9" width="6" height="6"/>
              <line x1="9" y1="1" x2="9" y2="4"/>
              <line x1="15" y1="1" x2="15" y2="4"/>
              <line x1="9" y1="20" x2="9" y2="23"/>
              <line x1="15" y1="20" x2="15" y2="23"/>
              <line x1="20" y1="9" x2="23" y2="9"/>
              <line x1="20" y1="14" x2="23" y2="14"/>
              <line x1="1" y1="9" x2="4" y2="9"/>
              <line x1="1" y1="14" x2="4" y2="14"/>
            </svg>
          </div>
          <div>
            <h2 class="sensor-name">Live Data Feed</h2>
            <span class="sensor-unit">Raw JSON packets</span>
          </div>
        </div>
      </div>
      <div class="data-feed-container">
        <pre class="data-feed mono" id="data-feed"></pre>
      </div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
